# --- Prefix: use C-a (Ctrl-a) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Quality ---
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on


# Colors
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB'


# --- Splits & navigation ---
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# --- Status bar ---
set -g status-position top
set -g status-interval 60
set -g status-justify centre
set -g status-bg black
set -g status-fg white
set -g status-left-length 40
set -g status-left '#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P'
set -g status-right '#[fg=cyan][%Y-%m-%d(%a) %H:%M]'

setw -g window-status-style fg=cyan,dim
setw -g window-status-current-style fg=white,bg=red,bright
setw -g monitor-activity on

set -g pane-border-style fg=green
set -g pane-active-border-style fg=white,bg=yellow
set -g message-style fg=white,bg=black,bright

set -g visual-activity on


# --- Reload ---
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"


# --- Copy mode (Vim-like + macOS clipboard) ---
setw -g mode-keys vi
set -g set-clipboard on #        
# -- For Mac 
#bind -T copy-mode-vi v send-keys -X begin-selection
#bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
#bind -T copy-mode-vi Y send-keys -X copy-end
# -- For Linux (Wayland)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Y send-keys -X copy-end


# --- Cosmetic --- 
# change the color of windows 
setw -g window-status-fg cyan
setw -g window-status-bg default
setw -g window-status-attr dim
# higlight active windows
setw -g window-status-current-fg white
setw -g window-status-current-bg red
setw -g window-status-current-attr bright
# Set color of the paintborder
set -g pane-border-fg green
set -g pane-border-bg black
# Enphasize active paint
set -g pane-active-border-fg white
set -g pane-active-border-bg yellow
# Set the color of commandline
set -g message-fg white
set -g message-bg black
set -g message-attr bright

